<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Paperforge — Markdown to Publication-grade PDF Publishing CLI</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Developer-first Node.js CLI that compiles Markdown documents into publication-grade PDFs with full-bleed styling, separate page/content margins, vector SVG charts, and dynamic metadata.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Themeable Stylesheet & Dark Mode -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  
  <style>
    :root {
      --base-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      --code-font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      --theme-color: #DFBA87;
      --theme-color-alt: #E8CA9D;
      
      /* Dark Theme Palettes */
      --base-background-color: #0A0B0E;
      --sidebar-background: #0F1117;
      --sidebar-border-color: #1E2330;
      --sidebar-nav-link-color: #94A3B8;
      --sidebar-nav-link-color--active: #DFBA87;
      --sidebar-nav-link-font-weight--active: 600;
      
      --code-inline-background: #171A24;
      --code-inline-color: #38BDF8;
      --code-theme-background: #11141E;
      
      --table-cell-border-color: #1E2330;
      --table-head-background: #131722;
      
      --blockquote-border-color: #DFBA87;
      --blockquote-background: #11141E;
      --blockquote-color: #94A3B8;
      
      --cover-background-color: #0A0B0E;
      --cover-button-background: #DFBA87;
      --cover-button-color: #0A0B0E;
      --cover-button-border: none;
    }

    /* Mermaid Container Tweaks */
    .mermaid {
      background: #11141E;
      padding: 1.5rem;
      border-radius: 8px;
      border: 1px solid #1E2330;
      text-align: center;
      margin: 1.5rem 0;
    }

    .app-name-link img {
      width: 28px;
      height: 28px;
      vertical-align: middle;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div id="app">Loading Paperforge Documentation...</div>
  <script>
    window.$docsify = {
      name: 'Paperforge',
      repo: 'https://github.com/vivekkushwaha66/paperforge',
      homepage: '01-overview-and-vision.md',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      auto2top: true,
      subMaxLevel: 3,
      maxLevel: 4,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found!',
        depth: 6
      },
      pagination: {
        previousText: 'PREVIOUS',
        nextText: 'NEXT',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    };
  </script>

  <!-- Docsify Core & Themeable -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>

  <!-- Plugins: Search, Copy Code, Pagination -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>

  <!-- Mermaid Plugin for live diagram rendering in documentation -->
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: true, theme: 'dark' });
    window.mermaid = mermaid;
  </script>
  <script src="https://unpkg.com/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>

  <!-- Prism Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-css.min.js"></script>
</body>
</html>
